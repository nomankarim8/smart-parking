<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Smart Parking System Architecture</title>
<desc id="desc">Layered architecture showing users, React frontend, FastAPI service domains, data storage, and optional external integrations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10243A"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F766E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1D4ED8"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6D28D9"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".32"/></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94B8C9" stroke-opacity=".055"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#5DDCCC"/></marker>
 <style>
 .h{font:700 17px Inter,Arial,sans-serif;fill:#F3FAFF}.sub{font:12px Inter,Arial,sans-serif;fill:#A7C0D0}.cap{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.7px;fill:#8DAFC2}.node{fill:#142B41;stroke:#42647A;stroke-width:1.2}.nodeTitle{font:700 15px Inter,Arial,sans-serif;fill:#EAF7FC}.nodeSub{font:12px Inter,Arial,sans-serif;fill:#9BB6C7}.connector{stroke:#5DDCCC;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 7;opacity:.8}
 </style>
</defs>
<rect width="1440" height="1040" rx="28" fill="url(#bg)"/>
<rect width="1440" height="1040" rx="28" fill="url(#grid)"/>
<circle cx="1250" cy="140" r="260" fill="#0F766E" opacity=".10"/>
<text x="64" y="64" class="cap">SYSTEM BLUEPRINT / HIGH-LEVEL VIEW</text>
<text x="64" y="105" fill="#F3FAFF" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">From vehicle arrival to parking operations</text>
<text x="64" y="134" class="sub">Layered application architecture • actual integrations depend on configuration and available devices/models</text>

<!-- user layer -->
<rect x="64" y="170" width="1312" height="115" rx="18" fill="#10273B" stroke="#41677C" filter="url(#shadow)"/>
<text x="88" y="198" class="cap">01 / PEOPLE &amp; CLIENTS</text>
<g transform="translate(88 216)">
 <rect width="270" height="48" rx="11" class="node"/><text x="18" y="21" class="nodeTitle">Administrator</text><text x="18" y="38" class="nodeSub">Users • cameras • pricing • audit</text>
 <rect x="286" width="270" height="48" rx="11" class="node"/><text x="304" y="21" class="nodeTitle">Parking Operator</text><text x="304" y="38" class="nodeSub">Entry • exit • review • payments</text>
 <rect x="572" width="270" height="48" rx="11" class="node"/><text x="590" y="21" class="nodeTitle">Parking Customer</text><text x="590" y="38" class="nodeSub">Reservation and payment journey</text>
 <rect x="858" width="338" height="48" rx="11" class="node"/><text x="876" y="21" class="nodeTitle">Browser / Responsive Devices</text><text x="876" y="38" class="nodeSub">Desktop • tablet • mobile</text>
</g>
<path d="M720 285V320" class="connector"/>

<!-- frontend layer -->
<rect x="64" y="326" width="1312" height="150" rx="18" fill="#10273B" stroke="#3B72A0" filter="url(#shadow)"/>
<rect x="64" y="326" width="9" height="150" rx="4" fill="url(#blue)"/>
<text x="88" y="354" class="cap">02 / PRESENTATION LAYER</text>
<text x="88" y="386" class="h">React + TypeScript + Vite</text>
<text x="88" y="408" class="sub">Responsive dashboard • role-aware navigation • Light / Dark / System themes</text>
<g transform="translate(600 354)">
 <rect width="220" height="88" rx="12" class="node"/><text x="16" y="28" class="nodeTitle">Operations UI</text><text x="16" y="49" class="nodeSub">Vehicles • sessions • occupancy</text><text x="16" y="68" class="nodeSub">Search • filters • forms</text>
 <rect x="238" width="220" height="88" rx="12" class="node"/><text x="254" y="28" class="nodeTitle">Monitoring UI</text><text x="254" y="49" class="nodeSub">Cameras • OCR review</text><text x="254" y="68" class="nodeSub">Notifications • status</text>
 <rect x="476" width="260" height="88" rx="12" class="node"/><text x="492" y="28" class="nodeTitle">Admin &amp; Insights UI</text><text x="492" y="49" class="nodeSub">Analytics • reports • audit</text><text x="492" y="68" class="nodeSub">Settings • permissions</text>
</g>
<path d="M720 476V512" class="connector"/>
<text x="744" y="498" fill="#8FDCD3" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">HTTPS / REST API + JWT</text>

<!-- backend layer -->
<rect x="64" y="518" width="1312" height="228" rx="18" fill="#10273B" stroke="#2C8E84" filter="url(#shadow)"/>
<rect x="64" y="518" width="9" height="228" rx="4" fill="url(#teal)"/>
<text x="88" y="547" class="cap">03 / APPLICATION &amp; SERVICE LAYER</text>
<text x="88" y="581" class="h">FastAPI / Python API</text>
<text x="88" y="603" class="sub">REST endpoints • validation • authorization • business rules • background processing</text>
<g transform="translate(88 625)">
 <rect width="232" height="92" rx="12" class="node"/><text x="16" y="27" class="nodeTitle">Identity &amp; Access</text><text x="16" y="49" class="nodeSub">JWT • roles • password security</text><text x="16" y="68" class="nodeSub">Session and account controls</text>
 <rect x="248" width="232" height="92" rx="12" class="node"/><text x="264" y="27" class="nodeTitle">Parking Domain</text><text x="264" y="49" class="nodeSub">Vehicles • slots • sessions</text><text x="264" y="68" class="nodeSub">Fees • entry / exit lifecycle</text>
 <rect x="496" width="232" height="92" rx="12" class="node"/><text x="512" y="27" class="nodeTitle">Camera &amp; ALPR</text><text x="512" y="49" class="nodeSub">OpenCV • OCR • optional YOLO</text><text x="512" y="68" class="nodeSub">Confidence • operator review</text>
 <rect x="744" width="232" height="92" rx="12" class="node"/><text x="760" y="27" class="nodeTitle">Payments &amp; Alerts</text><text x="760" y="49" class="nodeSub">Payment records • notifications</text><text x="760" y="68" class="nodeSub">Optional provider / SMS adapters</text>
 <rect x="992" width="232" height="92" rx="12" class="node"/><text x="1008" y="27" class="nodeTitle">Admin &amp; Reporting</text><text x="1008" y="49" class="nodeSub">Statistics • CSV • audit history</text><text x="1008" y="68" class="nodeSub">Pricing • blacklist alerts</text>
</g>
<path d="M720 746V782" class="connector"/>

<!-- persistence and integrations -->
<rect x="64" y="788" width="850" height="174" rx="18" fill="#10273B" stroke="#6C5AA6" filter="url(#shadow)"/>
<rect x="64" y="788" width="9" height="174" rx="4" fill="url(#purple)"/>
<text x="88" y="817" class="cap">04 / DATA &amp; STORAGE</text>
<g transform="translate(88 842)">
 <rect width="245" height="88" rx="12" class="node"/><text x="16" y="29" class="nodeTitle">MySQL / MariaDB</text><text x="16" y="51" class="nodeSub">Users • vehicles • sessions</text><text x="16" y="69" class="nodeSub">Slots • payments • history</text>
 <rect x="263" width="245" height="88" rx="12" class="node"/><text x="279" y="29" class="nodeTitle">Media &amp; Model Assets</text><text x="279" y="51" class="nodeSub">Uploaded demo footage</text><text x="279" y="69" class="nodeSub">Optional trained model weights</text>
 <rect x="526" width="245" height="88" rx="12" class="node"/><text x="542" y="29" class="nodeTitle">Reports &amp; Backups</text><text x="542" y="51" class="nodeSub">CSV • database exports</text><text x="542" y="69" class="nodeSub">Protected operational records</text>
</g>

<rect x="938" y="788" width="438" height="174" rx="18" fill="#10273B" stroke="#B77937" filter="url(#shadow)"/>
<rect x="938" y="788" width="9" height="174" rx="4" fill="#D97706"/>
<text x="962" y="817" class="cap">05 / OPTIONAL EXTERNAL INPUTS</text>
<g transform="translate(962 842)">
 <rect width="188" height="40" rx="10" class="node"/><text x="14" y="25" class="nodeTitle" font-size="13">USB / IP / RTSP cameras</text>
 <rect x="202" width="188" height="40" rx="10" class="node"/><text x="216" y="25" class="nodeTitle" font-size="13">Tesseract / EasyOCR</text>
 <rect y="49" width="188" height="40" rx="10" class="node"/><text x="14" y="74" class="nodeTitle" font-size="13">YOLO model weights</text>
 <rect x="202" y="49" width="188" height="40" rx="10" class="node"/><text x="216" y="74" class="nodeTitle" font-size="13">Twilio / payment sandbox</text>
</g>
<path d="M1160 788V770H1020V746" class="connector dashed"/>
<path d="M720 788V770" stroke="#5DDCCC" stroke-width="2" fill="none"/>
<text x="64" y="1002" fill="#7796AA" font-family="Inter,Arial,sans-serif" font-size="11">ARCHITECTURE NOTE: Optional integrations require compatible hardware, trained weights, provider credentials, and environment configuration.</text>
<text x="1376" y="1002" text-anchor="end" fill="#7796AA" font-family="Inter,Arial,sans-serif" font-size="11">SMART PARKING / HIGH-LEVEL VIEW</text>
</svg>
