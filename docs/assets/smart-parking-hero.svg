    <path d="M22 57H470" stroke="#628097" stroke-opacity=".3"/>
    <circle cx="28" cy="29" r="5" fill="#FB7185"/><circle cx="46" cy="29" r="5" fill="#FBBF24"/><circle cx="64" cy="29" r="5" fill="#34D399"/>
    <text x="90" y="34" fill="#BCD0DE" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1.5">CAMERA / ALPR DEMO PREVIEW</text>
    <g transform="translate(28 80)">
      <rect x="0" y="0" width="436" height="120" rx="13" fill="#0B1B2C" stroke="#36556D"/>
      <path d="M15 92H420" stroke="#5D7890" stroke-dasharray="8 8" stroke-opacity=".5"/>
      <path d="M28 20h380v76H28z" fill="none" stroke="#2DD4BF" stroke-opacity=".28" stroke-dasharray="5 5"/>
      <g transform="translate(110 28)">
        <path d="M10 48 21 20q3-8 12-8h92q9 0 13 9l12 27 10 9v17H0V58Z" fill="#1C5870" stroke="#5EEAD4" stroke-width="2"/>
        <path d="m30 22-8 21h119l-9-21q-2-5-8-5H39q-6 0-9 5Z" fill="#A5E7EC" opacity=".65"/>
        <path d="M54 26h47" stroke="#DFFBFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <rect x="56" y="53" width="55" height="14" rx="3" fill="#F8FAFC"/>
        <text x="83.5" y="63.5" text-anchor="middle" fill="#0F2436" font-family="Arial,sans-serif" font-size="7.5" font-weight="700">DHAKA METRO</text>
        <circle cx="34" cy="83" r="10" fill="#071321" stroke="#79B8C7" stroke-width="3"/><circle cx="134" cy="83" r="10" fill="#071321" stroke="#79B8C7" stroke-width="3"/>
        <path d="M-8 5h22M-8 5v22M166 5h-22M166 5v22M-8 101h22M-8 101V79M166 101h-22M166 101V79" stroke="#2DD4BF" stroke-width="2.5" fill="none"/>
      </g>
      <rect x="298" y="13" width="112" height="24" rx="12" fill="#123C37" stroke="#2DD4BF" stroke-opacity=".65"/>
      <circle cx="312" cy="25" r="4" fill="#34D399"/><text x="323" y="29" fill="#B9FFF2" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700">SAMPLE ALPR VIEW</text>
    </g>
    <g transform="translate(28 218)">
      <rect x="0" y="0" width="132" height="82" rx="12" fill="#132E42" stroke="#3E647B"/>
      <text x="14" y="22" fill="#91AFC1" font-family="Inter,Arial,sans-serif" font-size="10">PARKING SLOTS</text>
      <text x="14" y="51" fill="#EAF7FC" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800">24 <tspan fill="#2DD4BF" font-size="12">/ 32</tspan></text>
      <text x="14" y="69" fill="#70DCCB" font-family="Inter,Arial,sans-serif" font-size="9">Illustrative metric</text>
      <rect x="148" y="0" width="132" height="82" rx="12" fill="#132E42" stroke="#3E647B"/>
      <text x="162" y="22" fill="#91AFC1" font-family="Inter,Arial,sans-serif" font-size="10">CAMERA STATUS</text>
      <circle cx="171" cy="47" r="5" fill="#34D399"/><text x="184" y="51" fill="#EAF7FC" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">ONLINE</text>
      <text x="162" y="69" fill="#91AFC1" font-family="Inter,Arial,sans-serif" font-size="9">Connection state</text>
      <rect x="296" y="0" width="140" height="82" rx="12" fill="#132E42" stroke="#3E647B"/>
      <text x="310" y="22" fill="#91AFC1" font-family="Inter,Arial,sans-serif" font-size="10">ALPR WORKFLOW</text>
      <path d="M312 48h18l6-8 8 16 8-8h69" stroke="#2DD4BF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="310" y="69" fill="#91AFC1" font-family="Inter,Arial,sans-serif" font-size="9">OCR + review</text>
    </g>
  </g>
  <text x="68" y="408" fill="#7291A7" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="1.8">SMART PARKING SYSTEM • PROJECT DOCUMENTATION</text>
  <text x="1210" y="408" text-anchor="end" fill="#7291A7" font-family="Inter,Arial,sans-serif" font-size="10" letter-spacing="1.8">TEAL / NAVY / INTELLIGENCE</text>
</svg>
