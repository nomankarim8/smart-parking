<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Smart AI-Based Vehicle Parking Management System</title>
  <desc id="desc">A dark navy technology banner with a glowing teal roadway, a vehicle, camera detection frames, and parking slots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081321"/><stop offset="0.58" stop-color="#10243A"/><stop offset="1" stop-color="#0B1728"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D354C"/><stop offset="1" stop-color="#102238"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".23"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8AB7C8" stroke-opacity=".07" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="208" r="260" fill="url(#halo)"/>
  <circle cx="1120" cy="80" r="110" fill="#38BDF8" opacity=".08" filter="url(#soft)"/>
  <path d="M0 347 C240 300 450 398 690 341 S1080 280 1280 330" fill="none" stroke="#2DD4BF" stroke-opacity=".10" stroke-width="2"/>
  <g transform="translate(68 56)">
    <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#glow)"/>
    <path d="M9 26h26l-3-8a4 4 0 0 0-4-3H16a4 4 0 0 0-4 3l-3 8Zm3 0v7m20-7v7M15 33h18" fill="none" stroke="#062337" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="29" r="2.1" fill="#062337"/><circle cx="29" cy="29" r="2.1" fill="#062337"/>
    <text x="58" y="19" fill="#C8F7F0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">SMART PARKING / ALPR</text>
    <text x="58" y="38" fill="#8BA9BD" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="1.3">INTELLIGENT PARKING OPERATIONS</text>
  </g>
  <g transform="translate(68 154)">
    <text x="0" y="0" fill="#F4FAFF" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="800">Park smarter.</text>
    <text x="0" y="54" fill="#F4FAFF" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="800">Manage <tspan fill="#2DD4BF">intelligently.</tspan></text>
    <text x="2" y="98" fill="#A9C0D2" font-family="Inter,Arial,sans-serif" font-size="17">A full-stack CSE project for connected parking workflows,</text>
    <text x="2" y="124" fill="#A9C0D2" font-family="Inter,Arial,sans-serif" font-size="17">camera-assisted recognition, and operational visibility.</text>
    <g transform="translate(0 158)">
      <rect x="0" y="0" width="125" height="34" rx="17" fill="#123D45" stroke="#2DD4BF" stroke-opacity=".55"/>
      <text x="62.5" y="22" text-anchor="middle" fill="#B9FFF2" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">FASTAPI</text>
      <rect x="136" y="0" width="145" height="34" rx="17" fill="#142F51" stroke="#60A5FA" stroke-opacity=".55"/>
      <text x="208.5" y="22" text-anchor="middle" fill="#C6DEFF" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">REACT + TS</text>
      <rect x="292" y="0" width="145" height="34" rx="17" fill="#27304B" stroke="#A78BFA" stroke-opacity=".55"/>
      <text x="364.5" y="22" text-anchor="middle" fill="#DDD4FF" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">OPENCV / OCR</text>
    </g>
  </g>
  <!-- right-side system illustration -->
  <g transform="translate(720 56)" filter="url(#shadow)">
