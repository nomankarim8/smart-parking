<!doctype html>
<html>
  <head> 
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Smart Parking Control Center</title>
    <script>
      (() => {
        let mode = 'system';
        try {
          const token = localStorage.getItem('smart_parking_token');
          const userId = token && localStorage.getItem('smart_parking_theme_user_id');
          const stored = userId
            ? localStorage.getItem(`smart_parking_theme_user:${userId}`)
            : null;
          mode = stored
            || localStorage.getItem('smart_parking_theme_guest')
            || localStorage.getItem('smart_parking_theme')
            || 'system';
        } catch {
          mode = 'system';
        }
        if (!['light', 'dark', 'system'].includes(mode)) mode = 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
